services:
  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-geradores}:${POSTGRES_PASSWORD:-troque-este-valor-local}@db:5432/${POSTGRES_DB:-geradores}
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-geradores}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-troque-este-valor-local}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geradores}
      POSTGRES_USER: ${POSTGRES_USER:-geradores}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-este-valor-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-geradores}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-troque-este-valor-local}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:
